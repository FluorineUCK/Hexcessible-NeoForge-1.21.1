plugins {
    id "architectury-plugin" version "3.4.164"
    id "dev.architectury.loom" version "1.9-SNAPSHOT"
    id "maven-publish"
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

architectury {
    minecraft = project.minecraft_version
    platformSetupLoomIde()
    neoForge {
        platformPackage = "neoforge"
    }
}

loom {
    silentMojangMappingsLicense()
    mods {
        main {
            sourceSet sourceSets.main
        }
    }
}

repositories {
    mavenCentral()
    maven { url "https://maven.neoforged.net/releases/" }
    maven { url "https://maven.shedaniel.me/" }
    maven { url "https://maven.blamejared.com/" }
    maven { url "https://thedarkcolour.github.io/KotlinForForge/" }
    maven { url "https://maven.theillusivec4.top/" }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()

    neoForge "net.neoforged:neoforge:${project.neo_forge_version}"

    compileOnly files("libs/hexcasting-neoforge-${project.minecraft_version}-${project.hexcasting_version}.jar")
    runtimeOnly files("libs/hexcasting-neoforge-${project.minecraft_version}-${project.hexcasting_version}.jar")
    runtimeOnly files("libs/paucal-${project.paucal_version}+${project.minecraft_version}-neoforge.jar")
    runtimeOnly files("libs/inline-${project.minecraft_version}-${project.inline_version}-neoforge-devruntime.jar")
    runtimeOnly files("libs/caelus-neoforge-${project.caelus_version}.jar")

    modImplementation "me.shedaniel.cloth:cloth-config-neoforge:${project.cloth_config_version}"
    modCompileOnly "vazkii.patchouli:Patchouli:${project.patchouli_version}"
    modRuntimeOnly "vazkii.patchouli:Patchouli:${project.patchouli_version}"
    modRuntimeOnly "dev.architectury:architectury-neoforge:${project.architectury_version}"
    runtimeOnly "thedarkcolour:kotlinforforge-neoforge:${project.forge_kotlin_version}"

    compileOnly "org.jetbrains:annotations:${project.jetbrains_annotations_version}"
    compileOnly(annotationProcessor("io.github.llamalad7:mixinextras-common:${project.mixinextras_version}"))
    runtimeOnly(include("io.github.llamalad7:mixinextras-neoforge:${project.mixinextras_version}"))
}

processResources {
    inputs.property "version", project.version
    filesMatching("META-INF/neoforge.mods.toml") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.release = 21
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archives_base_name}" }
    }
}

tasks.named("sourcesJar", Jar) {
    exclude "META-INF/neoforge.mods.toml"
    exclude "META-INF/mods.toml"
    exclude "fabric.mod.json"
    exclude "*.mixins.json"
    exclude "**/*.mixins.json"
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }
}
